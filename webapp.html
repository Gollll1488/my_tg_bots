<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Создатели</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #1c1c1e;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        h1 {
            font-size: 32px;
            margin-bottom: 10px;
            text-align: center;
            color: #fff;
        }
        p {
            color: #8e8e93;
            margin-bottom: 30px;
            text-align: center;
            font-size: 16px;
        }
        .button {
            display: block;
            width: 100%;
            max-width: 300px;
            padding: 18px;
            margin: 10px 0;
            background: linear-gradient(90deg, #0088cc, #00aaff);
            color: white;
            text-decoration: none;
            text-align: center;
            border-radius: 14px;
            font-size: 18px;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0, 136, 204, 0.4);
            transition: transform 0.2s;
        }
        .button:active {
            transform: scale(0.95);
        }
        .footer {
            margin-top: 40px;
            font-size: 14px;
            color: #636366;
        }
    </style>
</head>
<body>
    <h1>👑 Создатели</h1>
    <p>Нажми на кнопку, чтобы написать:</p>

    <a href="https://t.me/morfinfuckk" class="button" target="_blank">👤 @morfinfuckk</a>
    <a href="https://t.me/scamyours" class="button" target="_blank">👤 @scamyours</a>

    <div class="footer">Powered by Telegram WebApp</div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();
    </script>
</body>
</html>
